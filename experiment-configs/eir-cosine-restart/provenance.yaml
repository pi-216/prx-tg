arm: eir-cosine-restart
arm_letter: ECR
aliases: []
mode: confirmatory            # gate frozen BEFORE the first run
status: active                # RUNNING from 2026-09-30 09:55 EDT; block 1 = steps 10001-11000
hypothesis: >
  The render-quality plateau observed on Arm EIR between ~6k and 10k steps was caused by the
  learning-rate SCHEDULE decaying to its 1e-6 floor, not by exhausted headroom: re-heating the LR
  on EIR's step-10000 weights (same model, same data, same optimizer, same dropout profile;
  horizon raised 10000 -> 20000 so the LR resumes at 1.56e-4) resumes a measurable gain in blind
  intra-sample human preference.
falsified_if: >
  The blind intra-sample Elo ordering over the continuation's checkpoints (10.0k..20.0k at
  500-step spacing) shows no resolvable improvement: the pre-registered split test separates the
  late half above the early half in 0 of 2 identity pools, AND the automatic trajectory at the
  same 500-step grid (recon LPIPS, loss, detection attrition) also flattens.
pre_registered_gate: >
  PASS if the blind intra-sample Elo ranking separates late (15.0k-20.0k) above early
  (10.0k-14.5k) PERFECTLY in >=1 of 2 identity pools (null p = 1/C(21,11) = 2.8e-6 per pool) with
  the other pool directionally consistent (Spearman(checkpoint, Elo) > 0), AND both pools are
  fully exhausted (every pair judged; an untrusted or unexhausted pool is INCONCLUSIVE, not FAIL),
  AND no regression in the yaw response (z_g dim0 -> yaw, monotone, correct sign) or in
  cross-render identity consistency. NOT gated on the tool's SNR meter: SNR >= 5 is structurally
  unreachable for a within-run field ~300 Elo wide (it would need avg RD <= 30, i.e. ~130 games
  per image against a maximum of 20).
pre_registered_null: >
  A fixed 11-item set holds the top 11 of 21 ranks with probability 1/C(21,11) = 3.0e-6 per pool
  (computed before the run); pooled Spearman(checkpoint, Elo) has mean 0. A low SNR or an
  untrusted pool is reported as "the instrument could not resolve", never as "no difference".
differs_from: eidolon-identity-renderer
diff_summary: |
  ONE variable: the learning-rate schedule. Resumed from EIR checkpoint_step0010000.pt WITH
  optimizer state. Verified by diff against the parent config — the complete list:
  - training.total_steps        10000 -> 20000   (the intervention: re-heats LR at the resume
                                                  step from 1e-6 to 1.56e-4, then cosine to floor
                                                  at 20000)
  - checkpoint.save_every       1000  -> 500     (instrumentation only: validation fires from the
                                                  checkpoint branch, so this sets the 500-step
                                                  render grid for the Elo pools)
  - checkpoint.keep_last_n      10    -> 20      (storage: 20 x ~2.8GB; NAS has 12TB free)
  - validation.interval_steps   1000  -> 500     (cosmetic: a dead knob, verified unread by
                                                  production/train.py, kept truthful)
  Byte-identical to EIR: adapter + cfg_dropout profile, model geometry, TREAD, Muon (peak 3e-4,
  floor 1e-6), both data sources, locked identity-level holdout, and the whole `sampling:` block —
  which is what keeps the continuation's renders comparable to the EIR pool at the same indices.

