# --- the return edge ---
# Teleology. `differs_from` is lineage (which config you forked); `serves` is purpose (what
# problem you were chasing). Written at DESCENT, before the first run — see AGENTS.md §0.3a.
serves: >
  the fidelity hurdle under eidolon's goal — make the renderer produce a high-quality, convincing
  image of a chosen identity, so that a point in identity space renders as a face worth looking at
tree_path:
  - "goal: prx-tg is the renderer for the product vision of `eidolon`"
  - "hurdle: high-fidelity image generation, based on identity-space and pose definition"
  - "this arm: eir-cosine-restart"
return_question: >
  Did a fresh learning-rate cycle on the EIR step-10000 weights resume measurable render-quality
  gain, or was the ~6k-10k plateau independent of the schedule?
# Answer at closure is exactly one of:
#   CLEARED     — gain resumed: the schedule was the brake; continuing this configuration is a
#                 live fidelity lever.
#   PIVOTED     — no resolvable gain: the schedule was not the brake. The lever is something else,
#                 and the operator's unnamed second half (capacity / spatial resolution /
#                 optimization mobility) must be named before it gets its own arm.
#   INVALIDATED — the arm cannot speak to the question (identity or yaw regressed, or the run
#                 failed to produce a rankable trajectory).

